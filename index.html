  --text: #0F172A;
  --text-muted: #64748B;
  --text-light: #94A3B8;
  --primary: #2563EB;
  --primary-hover: #1D4ED8;
  --primary-subtle: #EFF6FF;
  --primary-border: #BFDBFE;
  --success: #059669;
  --success-subtle: #ECFDF5;
  --success-border: #A7F3D0;
  --warning: #D97706;
  --warning-subtle: #FFFBEB;
  --warning-border: #FDE68A;
  --danger: #DC2626;
  --danger-subtle: #FEF2F2;
  --danger-border: #FECACA;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);

:root[data-theme="light"] {

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.header-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
}
.brand-badge {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 7px;
  background: var(--primary-subtle);
  color: var(--primary);
  border: 1px solid var(--primary-border);
  border-radius: var(--radius-full);
}

nav {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--surface-alt);
  padding: 4px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
}

nav button {
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

nav button:hover {
  color: var(--text);
  background: rgba(0, 0, 0, 0.04);
}

nav button.on {
  background: var(--surface);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

.nav-badge {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: var(--radius-full);
  background: var(--primary);
  color: #fff;
  font-weight: 700;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

main {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

h2 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

h3 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  margin-bottom: 8px;
}

h4 {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 14px 0 8px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.card.hoverable:hover {
  border-color: var(--border-focus);
  box-shadow: var(--shadow-md);
}

.grid-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-box .lbl {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}
.stat-box .val {
  font-size: 26px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s ease;
  line-height: 1.2;
}

.btn:hover {
  background: var(--border);
  color: var(--text);
}

.btn.p {
  background: var(--primary);
  color: #FFFFFF;
  border-color: var(--primary);
}
.btn.p:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.btn.g {
  background: var(--success);
  color: #FFFFFF;
  border-color: var(--success);
}
.btn.g:hover {
  opacity: 0.92;
}

.btn.d {
  color: var(--danger);
  border-color: var(--danger-border);
  background: var(--danger-subtle);
}
.btn.d:hover {
  background: var(--danger);
  color: #FFFFFF;
}

.btn.sm {
  padding: 5px 10px;
  font-size: 12px;
  border-radius: var(--radius-sm);
}

.btn[disabled], .btn:disabled {
  pointer-events: none;
  opacity: 0.45;
  cursor: not-allowed;
}

.btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text);
  user-select: none;
}

.chip.ok {
  background: var(--success-subtle);
  border-color: var(--success-border);
  color: var(--success);
  font-weight: 600;
}

.chip.no {
  background: var(--warning-subtle);
  border-color: var(--warning-border);
  color: var(--warning);
}

.chip.pick {
  cursor: pointer;
  transition: all 0.12s ease;
}

.chip.pick:hover {
  border-color: var(--border-focus);
}

.chip.pick.on {
  background: var(--primary);
  color: #FFFFFF;
  border-color: var(--primary);
  font-weight: 600;
}

.chip-remove {
  cursor: pointer;
  font-weight: bold;
  margin-left: 2px;
  opacity: 0.7;
}
.chip-remove:hover {
  opacity: 1;
}

.score-badge {
  min-width: 82px;
  text-align: center;
  border-radius: var(--radius-md);
  padding: 8px 10px;
  border: 1px solid var(--border);
  background: var(--surface-alt);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-badge .pct {
  font-size: 24px;
  font-weight: 800;
  line-height: 1.1;
}
.score-badge .tier {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

input, select, textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  font-size: 13.5px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

textarea {
  min-height: 80px;
  resize: vertical;
}

label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-muted);
  display: block;
  margin-bottom: 4px;
}

.filter-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  box-shadow: var(--shadow-sm);
}

.job-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  display: flex;
  gap: 18px;
  transition: all 0.15s ease;
}

.job-card:hover {
  border-color: var(--border-focus);
  box-shadow: var(--shadow-md);
}

.job-company-avatar {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-md);
  background: var(--primary-subtle);
  color: var(--primary);
  font-weight: 800;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--primary-border);
  flex-shrink: 0;
}

.job-content {
  flex: 1;
  min-width: 0;
}

.job-header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.job-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.job-meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 13px;
  color: var(--text-muted);
  margin: 4px 0 8px;
  align-items: center;
}

.job-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.job-desc {
  font-size: 13.5px;
  color: var(--text);
  margin: 8px 0 10px;
  line-height: 1.5;
}

/* Modal styles */
#m {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(4px);
  z-index: 100;
  padding: 20px;
  overflow-y: auto;
}
#m.on {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 860px;
  padding: 24px;
  margin: 30px auto;
  position: relative;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.paper-editor {
  background: #FFFFFF;
  color: #1E293B;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  padding: 20px;
  border: 1px solid #CBD5E1;
  border-radius: var(--radius-md);
  width: 100%;
  min-height: 380px;
  white-space: pre-wrap;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
}

.diff-card {
  border-left: 3px solid var(--success);
  background: var(--success-subtle);
  padding: 8px 12px;
  margin: 6px 0;
  border-radius: 4px;
  font-size: 13px;
  color: var(--text);
}
.diff-card.warn {
  border-left-color: var(--warning);
  background: var(--warning-subtle);
}

.timeline-step {
  border-left: 2px solid var(--border);
  padding-left: 14px;
  margin: 8px 0 8px 6px;
  font-size: 13px;
  position: relative;
}
.timeline-step::before {
  content: "";
  position: absolute;
  left: -5px;
  top: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
}

#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: var(--radius-full);
  font-weight: 600;
  font-size: 13.5px;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  display: none;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.banner {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  margin-bottom: 16px;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.banner.warning {
  background: var(--warning-subtle);
  border: 1px solid var(--warning-border);
  color: var(--warning);
}
.banner.info {
  background: var(--primary-subtle);
  border: 1px solid var(--primary-border);
  color: var(--primary);
}

@media (max-width: 768px) {
  .header-inner { flex-direction: column; align-items: stretch; }
  nav { overflow-x: auto; }
  .job-card { flex-direction: column; }
  .score-badge { align-self: flex-start; }
}

@media print {
  body > *:not(#m) { display: none !important; }
  #m { position: static; background: none; padding: 0; }
  .modal-box { border: 0; box-shadow: none; padding: 0; max-width: 100%; }
  .modal-box > *:not(.print-target) { display: none !important; }
  .paper-editor { border: 0; box-shadow: none; padding: 0; }
}
</style>

function h(s) {
  let x = 2166136261;
  for (const c of s) {
    x ^= c.charCodeAt(0);
    x = Math.imul(x, 16777619);
  }
  return x >>> 0;
}

function rng(s) {
  let a = h(s);
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function getLiveJobSearchUrl(platform, title, company, location) {
  const cleanLoc = location.replace(/\(.*?\)/g, '').trim();
  const isRemote = location.toLowerCase().includes('remote');
  const locQuery = isRemote ? 'remote' : cleanLoc;
  const coreTitle = title.replace(/(Senior|Lead|Principal|Associate)\s+/i, '').trim();
  const searchQuery = `${title}`;

  switch (platform) {
    case 'LinkedIn':
      return `https://www.linkedin.com/jobs/search/?keywords=${e(searchQuery)}&location=${e(locQuery || 'Worldwide')}${isRemote ? '&f_WT=2' : ''}`;
    case 'Naukri':
      return `https://www.naukri.com/jobs-in-${cleanLoc.toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'india'}?keyword=${e(searchQuery)}`;
    case 'Indeed':
      return `https://www.indeed.com/jobs?q=${e(searchQuery)}&l=${e(locQuery)}`;
    case 'Glassdoor':
      return `https://www.glassdoor.com/Job/jobs.htm?sc.keyword=${e(searchQuery)}&locKeyword=${e(locQuery)}`;
    case 'Google Jobs':
      return `https://www.google.com/search?q=${e(searchQuery + ' jobs in ' + locQuery)}&ibp=htl;jobs`;
    case 'Company Careers':
      return `https://www.google.com/search?q=${e(company + ' ' + coreTitle + ' careers ' + locQuery)}`;
    default:
      return `https://www.google.com/search?q=${e(searchQuery + ' ' + company + ' jobs in ' + locQuery)}&ibp=htl;jobs`;
  }
}

function tailorResume(job) {
  const master = S.p.resume || DEFAULT_MASTER_RESUME;
  const m = score(job);
  const targetTitle = job.title;
  const targetCompany = job.co;
  const userSkills = list(S.p.skills);

  const prioritizedSkills = m.ok.length ? m.ok : userSkills.slice(0, 5);

  let tailored = master;

  if (tailored.includes('Oracle Database Administrator | Database Engineer')) {
    tailored = tailored.replace('Oracle Database Administrator | Database Engineer', `${targetTitle} | Database Infrastructure Specialist`);
  }

  const summaryRegex = /(PROFESSIONAL SUMMARY\s*\n)(.*?)(\n\n)/s;
  if (summaryRegex.test(tailored)) {
    tailored = tailored.replace(summaryRegex, (match, header, body, end) => {
      let updatedBody = body;
      if (!updatedBody.includes(targetTitle)) {
        updatedBody = `Targeting ${targetTitle} role at ${targetCompany}. ` + updatedBody;
      }
      return `${header}${updatedBody}${end}`;
    });
  }

  const skillsRegex = /(CORE TECHNICAL COMPETENCIES.*?\n)(.*?)(\n\n[A-Z\s]{4,})/s;
  if (skillsRegex.test(tailored)) {
    tailored = tailored.replace(skillsRegex, (match, header, body, nextHeader) => {
      const lines = body.split('\n');
      lines.sort((a, b) => {
        const aMatches = prioritizedSkills.some(s => a.toLowerCase().includes(s.toLowerCase()));
        const bMatches = prioritizedSkills.some(s => b.toLowerCase().includes(s.toLowerCase()));
        if (aMatches && !bMatches) return -1;
        if (!aMatches && bMatches) return 1;
        return 0;
      });
      return `${header}${lines.join('\n')}${nextHeader}`;
    });
  }

  const changeLog = [
    { type: 'title', text: `Aligned resume headline to target role: “${targetTitle}”` },
    { type: 'summary', text: `Tailored professional summary to highlight ${prioritizedSkills.slice(0, 4).join(', ')} for ${targetCompany}` },
    { type: 'skills', text: `Prioritized matching competencies: ${prioritizedSkills.join(', ')}` },
    { type: 'experience', text: `Preserved authentic master resume experience, metrics, and project history without fabrication` }
  ];

  if (m.no.length) {
    changeLog.push({
      type: 'gap',
      warn: true,
      text: `Notice: Missing skills (${m.no.join(', ')}) were NOT fabricated, preserving strict integrity.`
    });
  }

  return {
    text: tailored,
    changeLog,
    score: m
  };
}

          <option value="match" ${F.sort==='match'?'selected':''}>Highest Match %</option>
          <option value="new" ${F.sort==='new'?'selected':''}>Newest First</option>
          <option value="exp" ${F.sort==='exp'?'selected':''}>Closest YOE Match</option>
          <option value="sal" ${F.sort==='sal'?'selected':''}>Highest Salary</option>
        </select>
      </div>
    </div>

    <!-- Active Filters & Count -->
    <div id="job-list-container"></div>
  `;

  renderJobList();
  renderLiveBar();
  if (!LIVE.busy && (!LIVE.tried || Date.now() - LIVE.at > 216e5)) refreshLive();
}

function renderJobList() {
  const container = $('#job-list-container');
  if (!container) return;

  const allJobs = genAllJobs();
  const userYoe = +S.p.yoe || 6.5;

  let filtered = allJobs.filter(j => {
    if (S.skip.includes(j.id)) return false;

    if (F.q) {
      const q = F.q.toLowerCase();
      const matchText = (j.title + ' ' + j.co + ' ' + j.loc + ' ' + j.desc + ' ' + j.reqs.join(' ')).toLowerCase();
      if (!matchText.includes(q)) return false;
    }

    if (F.role !== 'all' && !j.title.toLowerCase().includes(F.role.toLowerCase())) {
      return false;
    }

    if (F.mode !== 'all' && j.mode !== F.mode) {
      return false;
    }

    if (F.exp === 'match') {
      if (userYoe < j.minYoe - 1 || userYoe > j.maxYoe + 2) return false;
    } else if (F.exp === '0-2') {
      if (j.minYoe > 2) return false;
    } else if (F.exp === '3-5') {
      if (j.maxYoe < 3 || j.minYoe > 5) return false;
    } else if (F.exp === '6-8') {
      if (j.maxYoe < 6 || j.minYoe > 8) return false;
    } else if (F.exp === '9+') {
      if (j.maxYoe < 9) return false;
    }

    if (F.minSal > 0 && j.salNumericLpa && j.salNumericLpa < F.minSal) {
      return false;
    }

    const m = score(j);
    if (F.minMatch > 0 && m.pct < F.minMatch) {
      return false;
    }

    return true;
  });

  filtered.sort((a, b) => {
    const scA = score(a).pct;
    const scB = score(b).pct;
    if (F.sort === 'new') return a.d - b.d;
    if (F.sort === 'sal') return b.salNumericLpa - a.salNumericLpa;
    if (F.sort === 'exp') {
      const diffA = Math.abs(userYoe - a.minYoe);
      const diffB = Math.abs(userYoe - b.minYoe);
      return diffA - diffB;
    }
    return scB - scA;
  });

  if (!filtered.length) {
    container.innerHTML = `
      <div class="card" style="text-align:center;padding:40px 20px;">
        <div style="font-size:32px;margin-bottom:10px;">🔍</div>
        <h3>No jobs matched your current filters</h3>
        <p style="color:var(--text-muted);font-size:13.5px;max-width:440px;margin:0 auto 16px;">
          Try broadening your location selection, lowering the minimum salary, or adjusting the experience requirement filter.
        </p>
        <button class="btn p" onclick="resetFilters()">Reset All Filters</button>
      </div>
    `;
    return;
  }

  container.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--text-muted);">
      <span>Found <b>${filtered.length}</b> verified matching opportunities</span>
      <span>${F.exp !== 'all' ? `Filtered by ${F.exp} YOE · ` : ''} Sorted by ${F.sort}</span>
    </div>
    ${filtered.map(j => renderJobCard(j)).join('')}
  `;
}

function resetFilters() {
  F.q = '';
  F.minMatch = 0;
  F.exp = 'all';
  F.minSal = 0;
  F.role = 'all';
  F.mode = 'all';
  F.sort = 'match';

}

    jobs();

}

  const text = $('#res-editor')?.value || CUR;

var FB = null, U = null, unsub = null, pushT = null;
const FBK = 'jobpilot_fbcfg';

const fbCfgGet = () => {
  try { return FBCFG || JSON.parse(localStorage.getItem(FBK) || 'null'); } catch (e) { return null; }
};

const loadJs = u => new Promise((resolve, reject) => {
  const x = document.createElement('script');
  x.src = u;
  x.onload = resolve;
  x.onerror = () => reject(new Error('Could not load Firebase library'));
  document.head.appendChild(x);
});

async function fbInit() {
  if (FB) return FB;
  const cfg = fbCfgGet();
  if (!cfg) return null;
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  if (!window.firebase) {
    await loadJs(B + 'firebase-app-compat.js');
    await loadJs(B + 'firebase-auth-compat.js');
    await loadJs(B + 'firebase-firestore-compat.js');
  }
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  FB = { a: firebase.auth(), d: firebase.firestore() };
  FB.a.onAuthStateChanged(u => {
    U = u;
    if (u) startSync();
    else if (unsub) { unsub(); unsub = null; }
    if (pg === 'set') set();
  });
  return FB;
}

function startSync() {
  const ref = FB.d.doc('users/' + U.uid);
  let first = true;
  if (unsub) unsub();
  unsub = ref.onSnapshot(sn => {
    if (sn.metadata.hasPendingWrites) return;
    let c = null;
    try { c = sn.exists ? JSON.parse(sn.data().json) : null; } catch (e) {}
    if (first) {
      first = false;
      if (!c) { cloudPush(1); return; }
      const empty = !S.apps.length && !S.p.resume;
      if (empty || c.mod > (S.mod || 0)) {
        snap(1);
        S = Object.assign({}, S, c);
        local();
        render();
        toast('Synced from cloud');
      } else if (c.mod < (S.mod || 0)) {
        cloudPush(1);
      }
      return;
    }
    if (c && c.mod > (S.mod || 0)) {
      S = Object.assign({}, S, c);
      local();
      render();
      toast('Updated from cloud device');
    }
  }, er => toast('Sync error: ' + er.message));
}

function cloudPush(now) {
  clearTimeout(pushT);
  const go = async () => {
    if (!U || !FB) return;
    try {
      await FB.d.doc('users/' + U.uid).set({ json: JSON.stringify(S), mod: S.mod || Date.now() });
      S.lastSync = Date.now();
      local();
      if (pg === 'set') set();
    } catch (e) {
      toast('Cloud save failed: ' + e.message);
    }
  };
  now ? go() : (pushT = setTimeout(go, 2000));
}

}
function norm(o) {
  const d = strip(o.desc), low = o.title + ' ' + d;
  const sk = [...new Set([...list(S.p.skills), ...KW])].filter(k => has(low, k)).slice(0, 10);
  const m = d.match(/(\d{1,2})\s*\+?\s*(?:-|–|to)?\s*(\d{1,2})?\s*\+?\s*(?:years|yrs)/i);
  const mn = m ? +m[1] : 0, mx = m ? (+m[2] || mn + 3) : 25;
  return { id: 'lv_' + h(o.url), isLive: true, co: o.co || 'Company', title: strip(o.title), loc: o.loc || 'Remote',
    mode: o.remote ? 'Remote' : (/hybrid/i.test(low) ? 'Hybrid' : 'On-site'), minYoe: mn, maxYoe: mx,
    salText: o.sal || 'Not disclosed', salNumericLpa: o.lpa || 0, src: o.src,
    d: Math.max(0, Math.floor((Date.now() - new Date(o.date || Date.now())) / 864e5)), reqs: sk,
    desc: d.slice(0, 420) + (d.length > 420 ? '…' : ''), directUrl: o.url };
}
async function jf(u, opt) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 15000);
  try { const r = await fetch(u, { ...opt, signal: c.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); } finally { clearTimeout(t); }
}
async function fetchLive() {
  const T = list(S.p.titles).slice(0, 3), K = KEYS(), regs = [...new Set([...S.regions, ...S.customRegions])], out = [], st = {};
  const run = async (name, fn) => { try { const a = await fn(); out.push(...a); st[name] = a.length; } catch (x) { st[name] = 'failed (' + (x.message || 'blocked') + ')'; } };
  await Promise.all([
    run('Remotive', async () => (await Promise.all(T.map(t => jf('https://remotive.com/api/remote-jobs?search=' + e(t))))).flatMap(r => (r.jobs || []).map(j => ({ ...norm({ url: j.url, title: j.title, co: j.company_name, loc: 'Remote — ' + (j.candidate_required_location || 'Worldwide'), desc: j.description, src: 'Remotive', date: j.publication_date, remote: 1, sal: j.salary }), q: 'Remote' })))),
    run('Arbeitnow', async () => {
      const r = await jf('https://www.arbeitnow.com/api/job-board-api'), q = T.join(' ').toLowerCase().split(/\W+/).filter(w => w.length > 3);
      return (r.data || []).filter(j => q.some(w => (j.title + ' ' + (j.tags || []).join(' ')).toLowerCase().includes(w))).map(j => ({ ...norm({ url: j.url, title: j.title, co: j.company_name, loc: j.location, desc: j.description, src: 'Arbeitnow', date: j.created_at * 1000, remote: j.remote }), q: j.remote ? 'Remote' : '' }));
    }),
    K.adz_id && run('Adzuna', async () => {
      const jobs = [];
      await Promise.all(T.flatMap(t => regs.filter(r => ADZ[r]).slice(0, 6).map(async r => {
        const d = await jf(`https://api.adzuna.com/v1/api/jobs/${ADZ[r]}/search/1?app_id=${K.adz_id}&app_key=${K.adz_key}&results_per_page=15&max_days_old=30&sort_by=date&what=${e(t)}&where=${e(r)}`).catch(() => ({}));
        (d.results || []).forEach(j => jobs.push({ ...norm({ url: j.redirect_url, title: j.title, co: j.company && j.company.display_name, loc: j.location && j.location.display_name, desc: j.description, src: 'Adzuna', date: j.created, sal: j.salary_min ? Math.round(j.salary_min).toLocaleString() + '–' + Math.round(j.salary_max || j.salary_min).toLocaleString() : '', lpa: ADZ[r] === 'in' && j.salary_min ? Math.round(j.salary_min / 1e5) : 0 }), q: r }));
      })));
      return jobs;
    }),
    K.jsearch && run('JSearch', async () => {
      const jobs = [];
      await Promise.all(regs.slice(0, 5).map(async r => {
        const d = await jf(`https://jsearch.p.rapidapi.com/search?page=1&num_pages=1&query=${e(T[0] + (/remote/i.test(r) ? ' remote' : ' in ' + r))}`, { headers: { 'X-RapidAPI-Key': K.jsearch, 'X-RapidAPI-Host': 'jsearch.p.rapidapi.com' } }).catch(() => ({}));
        (d.data || []).forEach(j => jobs.push({ ...norm({ url: j.job_apply_link, title: j.job_title, co: j.employer_name, loc: [j.job_city, j.job_country].filter(Boolean).join(', '), desc: j.job_description, src: 'JSearch', date: j.job_posted_at_datetime_utc, remote: j.job_is_remote, sal: j.job_min_salary ? `${j.job_salary_currency || ''} ${j.job_min_salary}–${j.job_max_salary || ''}` : '' }), q: r }));
      }));
      return jobs;
    })
  ]);
  const seen = new Set(), list2 = out.filter(j => j.directUrl && !seen.has((j.co + j.title + j.loc).toLowerCase()) && seen.add((j.co + j.title + j.loc).toLowerCase()));
  if (list2.length) LJ = list2;
  LIVE.st = st; LIVE.at = Date.now(); LIVE.sig = sigNow();
  try { localStorage.setItem('jp_live', JSON.stringify({ jobs: LJ, at: LIVE.at, sig: LIVE.sig, st })); } catch (x) {}
}
async function refreshLive() {
  if (LIVE.busy) return;
  LIVE.busy = LIVE.tried = true; renderLiveBar();
  try { await fetchLive(); } catch (x) {}
  LIVE.busy = false;
  if (pg === 'jobs') { renderLiveBar(); renderJobList(); }
  toast(LJ.length + ' real postings loaded');
}
function renderLiveBar() {
  const el = $('#live-bar'); if (!el) return;
  const K = KEYS(), stale = LIVE.sig && LIVE.sig !== sigNow();
  el.innerHTML = `<div class="banner ${LJ.length ? 'info' : 'warning'}"><div><b>${LIVE.busy ? '⏳ Fetching real postings…' : LJ.length + ' real, live postings (each opens the actual job page)'}</b><br><span style="opacity:.85">${Object.entries(LIVE.st).map(([k, v]) => k + ': ' + v).join(' · ')}${LIVE.at ? ' · updated ' + new Date(LIVE.at).toLocaleTimeString() : ''}</span>${stale && !LIVE.busy ? '<br>Titles/regions changed since last fetch — press refresh.' : ''}${!K.adz_id && !K.jsearch ? '<br>For India/Gulf on-site jobs add a free Adzuna or JSearch key in Settings. Without keys you only get remote/Europe jobs.' : ''}</div><button class="btn sm p" onclick="refreshLive()">🔄 Refresh live jobs</button></div>`;
}
function saveKeys() {
  try { localStorage.setItem('jp_keys', JSON.stringify({ adz_id: $('#k1').value.trim(), adz_key: $('#k2').value.trim(), jsearch: $('#k3').value.trim() })); } catch (x) {}
  toast('Keys saved'); refreshLive();
}
function renderLiveSettings() {
  const K = KEYS(), v = x => esc(K[x] || '');
  return `<div class="card"><h3>🌐 Real job sources</h3><p style="font-size:13px;color:var(--text-muted);margin-bottom:10px">Free without keys: Remotive + Arbeitnow (remote / Europe). For India, Gulf and on-site roles add a free key: <b>Adzuna</b> (developer.adzuna.com) and/or <b>JSearch</b> on RapidAPI (covers LinkedIn / Indeed / Google Jobs). Keys stay in this browser only (not synced).</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px"><div><label>Adzuna app_id</label><input id="k1" value="${v('adz_id')}"></div><div><label>Adzuna app_key</label><input id="k2" value="${v('adz_key')}"></div><div><label>JSearch RapidAPI key</label><input id="k3" value="${v('jsearch')}"></div></div>
  <div class="btns"><button class="btn p" onclick="saveKeys()">Save keys & refresh</button><label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" style="width:auto" ${S.demo ? 'checked' : ''} onchange="S.demo=this.checked;save()"> Also show fake sample jobs (demo only)</label></div></div>
  <div class="card"><h3>🚀 Auto-apply helper (desktop)</h3><p style="font-size:13px;color:var(--text-muted)">A web page cannot submit forms on other websites, so a small local program does it. In a terminal: <code>pip install playwright</code> → <code>playwright install chromium</code> → <code>python helper.py</code>. Keep it running, then use “Auto-apply” on any real job. It fills the form, uploads a PDF of your approved resume, and stops for CAPTCHA, login or missing fields.</p></div>`;
}
// ---------------- AUTO-APPLY (local helper) ----------------
const HELPER = 'http://localhost:8765'; var HP = false;
async function pingHelper() {
  try { const c = new AbortController(); setTimeout(() => c.abort(), 1500); HP = (await fetch(HELPER + '/health', { signal: c.signal })).ok; } catch (x) { HP = false; }
  const el = $('#hp-st'); if (el) { el.className = 'chip ' + (HP ? 'ok' : 'no'); el.textContent = HP ? '● Helper connected' : '○ Helper offline — see Settings'; }
  syncAuto();
}
function syncAuto() { const b = $('#btn-auto'); if (b) b.disabled = !(b.dataset.ok && HP && b.dataset.url); }
async function autoApply(id) {
  const j = genAllJobs().find(x => x.id === id); if (!j || !j.directUrl) return;
  const p = S.p, qs = generateInterviewQuestions(j), box = $('#ap-status');
  if (!p.email || !p.phone) { toast('Add email and phone in Profile first'); return; }
  const d = { url: j.directUrl, mode: $('#ap-mode').value, resume: $('#res-editor').value, name: p.name, email: p.email, phone: p.phone, yoe: p.yoe, salary: p.salary, notice: p.notice, location: S.regions[0] || '', why: qs[0].val };
  box.innerHTML = '<div class="banner info">Starting helper…</div>';
  try { const r = await (await fetch(HELPER + '/apply', { method: 'POST', body: JSON.stringify(d) })).json(); pollApply(r.id, j.id); }
  catch (x) { box.innerHTML = '<div class="banner warning">Helper not reachable.</div>'; }
}
async function pollApply(id, jid) {
  const box = $('#ap-status');
  try {
    const s = await (await fetch(HELPER + '/status?id=' + id)).json();
    if (box) box.innerHTML = `<div class="banner ${s.state === 'error' || s.state === 'needs_you' ? 'warning' : 'info'}">${esc(s.msg)}</div>`;
    if (s.state === 'submitted') { recordApplication(jid, 'APPLIED'); return; }
    if (s.state !== 'error' && s.state !== 'done') setTimeout(() => pollApply(id, jid), 3000);
  } catch (x) { if (box) box.innerHTML = '<div class="banner warning">Lost contact with helper.</div>'; }
}

if (fbCfgGet()) fbInit().catch(() => {});
render();
