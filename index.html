function gen(){const T=list(S.p.titles).slice(0,4),sk=list(S.p.skills),out=[],seen=new Set();if(!T.length)return out;
T.forEach(t=>S.regions.forEach(loc=>{for(let k=0;k<4;k++){const r=rng(t+loc+k),co=CO[r()*CO.length|0],ti=PRE[r()*PRE.length|0]+t,key=(co+ti+loc).toLowerCase();if(seen.has(key))continue;seen.add(key);

function score(j){const sk=list(S.p.skills).map(s=>s.toLowerCase()),ok=j.reqs.filter(r=>sk.some(s=>s.includes(r.toLowerCase())||r.toLowerCase().includes(s)));return{ok,no:j.reqs.filter(r=>!ok.includes(r)),pct:Math.round(ok.length/j.reqs.length*100)}}

<h4>Proposed resume changes (no fabrication)</h4>${r.diff.map(d=>`<div class="diff ${d.a?'':'n'}">${d.a?'✚':'⚠'} ${esc(d.t)}</div>`).join('')}
<h4>ATS check</h4><div class="chips">${r.ats.map(([t,o])=>`<span class="chip ${o?'ok':'no'}">${o?'✓':'!'} ${esc(t)}</span>`).join('')}</div>
<h4>Resume preview (master resume stays untouched)</h4><div class="pv"><div class="paper">${esc(r.text)}</div></div><div class="btns"><button class="btn" onclick="cp()">Copy text</button><button class="btn" onclick="print()">Print / Save PDF</button></div>
<h4>Application questions — edit, they're saved to your answer bank</h4>${Q.map(x=>`<label>${esc(x.t)} ${x.a?'':'<b style="color:var(--y)">REQUIRES USER REVIEW</b>'}</label><textarea oninput="S.ans['${x.k}']=this.value;save()">${esc(x.a)}</textarea>`).join('')}
<h4>Approve & apply</h4><label style="display:flex;gap:8px;align-items:center;color:var(--t);font-size:13px"><input type="checkbox" style="width:auto" onchange="$('#go').disabled=$('#dr2').disabled=!this.checked"> I reviewed the resume preview and answers and approve them.</label>
<p class="m" style="margin:6px 0">Browsers can't submit to other websites for you. Open the real application page, paste your approved resume and answers, then mark it applied here to track it. CAPTCHA/MFA always stay with you.</p>
<div class="btns"><button class="btn" onclick="cm()">Cancel</button><button class="btn" onclick="mk('${j.id}','DRAFT')">Save draft</button><a class="btn p" target="_blank" rel="noopener" href="${liveUrl(j.src,j.title+' '+j.co,j.loc)}" id="dr2" disabled>Open application page ↗</a><button class="btn g" id="go" disabled onclick="mk('${j.id}','APPLIED')">Mark as applied</button></div>`;$('#m').classList.add('on')}
function mk(id,st){const j=gen().find(x=>x.id===id);if(!j)return;let a=appOf(j);if(a&&a.status!=='WITHDRAWN'&&st==='APPLIED'&&a.status==='APPLIED'&&!confirm('You appear to have already applied. Record again?'))return;
if(!a){a={id:'a'+Date.now(),jid:j.id,co:j.co,title:j.title,src:j.src,loc:j.loc,job:j,tl:[{t:Date.now(),d:'Job discovered'},{t:Date.now(),d:`Match score ${score(j).pct}%`}],notes:'',at:Date.now()};S.apps.unshift(a)}
a.resume=CUR;a.status=st;a.tl.push({t:Date.now(),d:st=='APPLIED'?'Resume approved · application submitted (confirmed by you)':'Draft saved with tailored resume'});if(st=='APPLIED')a.at=Date.now();save();cm();toast(st=='APPLIED'?'Application tracked ✔':'Draft saved');pg='apps';render()}
function setSt(id,st){const a=S.apps.find(x=>x.id==id);a.status=st;a.tl.push({t:Date.now(),d:'Status changed to '+st});save();render()}
function cancelApp(id){if(!confirm('Cancel/withdraw this application? Remember to also withdraw on the employer site if you already applied.'))return;setSt(id,'WITHDRAWN')}
function delApp(id){if(!confirm('Remove this application record permanently?'))return;S.apps=S.apps.filter(x=>x.id!=id);save();render()}
function apps(){$('#main').innerHTML=`<h2>Applications</h2>`+(S.apps.map(a=>`<div class="card"><div class="row"><div class="grow"><h3>${esc(a.title)}</h3><div class="m">${esc(a.co)} · ${esc(a.loc)} · ${a.src}</div></div><select style="width:170px" onchange="setSt('${a.id}',this.value)">${ST.map(s=>`<option ${a.status==s?'selected':''}>${s}</option>`).join('')}</select></div>
<div class="btns"><a class="btn" target="_blank" rel="noopener" href="${liveUrl(a.src,a.title+' '+a.co,a.loc)}">Check real site ↗</a><button class="btn" onclick="viewRes('${a.id}')">View resume</button>${a.status!=='WITHDRAWN'?`<button class="btn d" onclick="cancelApp('${a.id}')">Cancel application</button>`:''}<button class="btn d" onclick="delApp('${a.id}')">Delete</button></div>
<label style="margin-top:8px">Notes</label><textarea oninput="S.apps.find(x=>x.id=='${a.id}').notes=this.value;save()">${esc(a.notes)}</textarea><h4>Timeline</h4>${a.tl.map(t=>`<div class="tl"><b>${new Date(t.t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</b> — ${esc(t.d)}</div>`).join('')}</div>`).join('')||'<div class="card m">No applications yet. Open a job and use “Preview resume & apply”.</div>')}
function viewRes(id){const a=S.apps.find(x=>x.id==id);CUR=a.resume||'';$('#mb').innerHTML=`<div class="row"><h3 class="grow">Tailored resume — ${esc(a.title)} @ ${esc(a.co)}</h3><button class="btn" onclick="cm()">✕</button></div><div class="pv"><div class="paper">${esc(CUR)}</div></div><div class="btns"><button class="btn" onclick="cp()">Copy text</button><button class="btn" onclick="print()">Print / Save PDF</button></div>`;$('#m').classList.add('on')}
function resume(){$('#main').innerHTML=`<h2>Resume</h2><div class="card"><h3>Master resume</h3><p class="m">${S.p.resume?esc(S.p.resumeName||'Pasted text')+' · '+S.p.resume.length+' characters. It is never edited — each job gets its own tailored copy.':'No resume yet.'}</p><div class="btns"><button class="btn p" onclick="pg='profile';render()">${S.p.resume?'Update':'Add'} master resume</button></div></div>
<div class="card"><h3>How tailoring works</h3><p class="m">For each job you get an ATS-friendly single-column resume: summary rewritten for the role, matching skills moved first, your real experience kept as written, plus a change list and ATS check. Skills you don't have are never added.</p></div><h3>Tailored resumes (${S.apps.filter(a=>a.resume).length})</h3>${S.apps.filter(a=>a.resume).map(a=>`<div class="card row"><div class="grow">${esc(a.title)} · ${esc(a.co)}</div><button class="btn" onclick="viewRes('${a.id}')">Preview</button></div>`).join('')||'<p class="m">Tailor one from any job.</p>'}`}
function profile(){const p=S.p,f=(id,l,v,t='text')=>`<div><label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}"></div>`;$('#main').innerHTML=`<h2>Profile</h2><div class="card"><div class="f">${f('pn','Full name',p.name)}${f('pe','Email',p.email,'email')}${f('pp','Phone',p.phone)}${f('py','Years of experience',p.yoe,'number')}${f('ps','Expected salary',p.salary)}${f('pnt','Notice period',p.notice)}${f('pa','Work authorization (answer yourself)',p.auth)}</div>
<div class="f"><div><label>Target job titles (comma separated) — job search follows these</label><input id="pt" value="${esc(p.titles)}"></div><div><label>Skills (comma separated)</label><input id="pk" value="${esc(p.skills)}"></div></div><label>Professional summary (optional)</label><textarea id="psu">${esc(p.summary)}</textarea>
<label style="margin-top:10px">Master resume — paste text, or load a .txt/.md file (for PDF/DOCX, copy and paste the text)</label><input type="file" accept=".txt,.md" onchange="lf(this)"><textarea id="pr" style="min-height:200px;margin-top:6px">${esc(p.resume)}</textarea><div class="btns"><button class="btn p" onclick="sp()">Save profile & refresh jobs</button></div></div>`}
function lf(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#pr').value=r.result;S.p.resumeName=f.name};r.readAsText(f)}
function sp(){const v=i=>$('#'+i).value;Object.assign(S.p,{name:v('pn'),email:v('pe'),phone:v('pp'),yoe:+v('py')||0,salary:v('ps'),notice:v('pnt'),auth:v('pa'),titles:v('pt'),skills:v('pk'),summary:v('psu'),resume:v('pr')});save();toast(`Saved — ${gen().length} jobs matched to your profile`);pg='jobs';render()}
function set(){$('#main').innerHTML=`<h2>Settings</h2><div class="card"><h3>Theme</h3><div class="btns">${['','light','dark'].map(t=>`<button class="btn" onclick="S.theme='${t}';save();document.documentElement.dataset.theme='${t}';if(!'${t}')delete document.documentElement.dataset.theme">${t||'System'}</button>`).join('')}</div></div>
<div class="card"><h3>Your data</h3><p class="m">Everything lives in this browser only. No resume or personal data is sent anywhere.</p><div class="btns"><button class="btn p" onclick="dl()">⬇ Download backup file</button><label class="btn" style="margin:0">⬆ Import backup file<input type="file" accept=".json" hidden onchange="impFile(this)"></label><label style="display:flex;gap:6px;align-items:center;color:var(--t);margin:0"><input type="checkbox" id="mg" style="width:auto" checked> Merge (keep current data)</label><button class="btn" onclick="exp()">Show / copy JSON</button><button class="btn" onclick="pasteImp()">Paste JSON to import</button><button class="btn" onclick="S.skip=[];save();toast('Hidden jobs restored')">Restore skipped jobs</button><button class="btn d" onclick="if(confirm('Delete ALL data?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}">Delete all data</button></div></div>
${cloud()}<div class="card"><h3>Backup history</h3><p class="m">Snapshots are saved automatically in this browser (last 15, about every 30 min while you work). Download a backup file regularly — it's the only copy that survives clearing browser data.</p>${hist()}</div><div class="card"><h3>Safety rules</h3><p class="m">Never fabricates experience. Never bypasses CAPTCHA, MFA or anti-bot controls. Final submission is always yours. Uncertain answers are flagged REQUIRES USER REVIEW.</p></div>`}
function exp(){CUR=JSON.stringify(S,null,2);$('#mb').innerHTML=`<div class="row"><h3 class="grow">Export</h3><button class="btn" onclick="cm()">✕</button></div><textarea style="min-height:300px">${esc(CUR)}</textarea><div class="btns"><button class="btn p" onclick="cp()">Copy</button></div>`;$('#m').classList.add('on')}
function cp(){try{navigator.clipboard.writeText(CUR).then(()=>toast('Copied'),()=>toast('Copy blocked — select the text manually'))}catch(x){toast('Copy blocked — select manually')}}
function cm(){$('#m').classList.remove('on')}
function dl(){const n='jobpilot-backup-'+new Date().toISOString().slice(0,10)+'.json';try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove();S.lastBk=Date.now();save();toast('Backup downloaded: '+n)}catch(x){exp()}}
function imp(t,mg){try{const d=JSON.parse(t);if(!d.p||!Array.isArray(d.apps))throw 0;snap(1);if(mg){const ids=new Set(S.apps.map(a=>a.id));d.apps.forEach(a=>ids.has(a.id)||S.apps.push(a));S.ans={...d.ans,...S.ans};S.skip=[...new Set([...S.skip,...(d.skip||[])])];S.save=[...new Set([...S.save,...(d.save||[])])];if(!S.p.resume)S.p=d.p}else S=Object.assign({},S,d);save();toast('Backup imported');render()}catch(x){toast('Not a valid JobPilot backup file')}}
function impFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result,$('#mg').checked);r.readAsText(f)}
function pasteImp(){$('#mb').innerHTML=`<div class="row"><h3 class="grow">Paste backup JSON</h3><button class="btn" onclick="cm()">✕</button></div><textarea id="pj" style="min-height:260px"></textarea><div class="btns"><button class="btn p" onclick="imp($('#pj').value,$('#mg')?.checked??true);cm()">Import (merge)</button></div>`;$('#m').classList.add('on')}
function hist(){let H=[];try{H=JSON.parse(localStorage.getItem(KEY+'_h')||'[]')}catch(e){}return H.map((x,i)=>`<div class="tl">${new Date(x.t).toLocaleString()} · ${x.n} applications <button class="btn" onclick="rest(${i})">Restore</button></div>`).join('')||'<p class="m">Snapshots appear automatically as you work.</p>'}
function rest(i){try{const H=JSON.parse(localStorage.getItem(KEY+'_h')||'[]');if(!confirm('Restore this snapshot? Current data is snapshotted first.'))return;snap(1);S=Object.assign({},S,JSON.parse(H[i].d));save();toast('Snapshot restored');render()}catch(x){toast('Restore failed')}}
let FB=null,U=null,unsub=null,pushT=null;const FBK='jobpilot_fbcfg',fbCfgGet=()=>{try{return FBCFG||JSON.parse(localStorage.getItem(FBK)||'null')}catch(e){return null}};
const loadJs=u=>new Promise((r,j)=>{const x=document.createElement('script');x.src=u;x.onload=r;x.onerror=()=>j(new Error('Could not load Firebase (offline or blocked)'));document.head.appendChild(x)});
async function fbInit(){if(FB)return FB;const cfg=fbCfgGet();if(!cfg)return null;const B='https://www.gstatic.com/firebasejs/10.12.2/';if(!window.firebase){await loadJs(B+'firebase-app-compat.js');await loadJs(B+'firebase-auth-compat.js');await loadJs(B+'firebase-firestore-compat.js')}
if(!firebase.apps.length)firebase.initializeApp(cfg);FB={a:firebase.auth(),d:firebase.firestore()};FB.a.onAuthStateChanged(u=>{U=u;if(u)startSync();else if(unsub){unsub();unsub=null}if(pg=='set')set()});return FB}
function startSync(){const ref=FB.d.doc('users/'+U.uid);let first=true;if(unsub)unsub();unsub=ref.onSnapshot(sn=>{if(sn.metadata.hasPendingWrites)return;let c=null;try{c=sn.exists?JSON.parse(sn.data().json):null}catch(e){}
if(first){first=false;if(!c){cloudPush(1);return}const empty=!S.apps.length&&!S.p.resume;if(empty||c.mod>(S.mod||0)){if(empty||confirm('Cloud data is newer than this device. Load it? (Current data is snapshotted first.)')){snap(1);S=Object.assign({},S,c);local();render();toast('Synced from cloud')}}else if(c.mod<(S.mod||0))cloudPush(1);return}
if(c&&c.mod>(S.mod||0)){S=Object.assign({},S,c);local();render();toast('Updated from another device')}},er=>toast('Sync error: '+er.message))}
function cloudPush(now){clearTimeout(pushT);const go=async()=>{if(!U||!FB)return;try{await FB.d.doc('users/'+U.uid).set({json:JSON.stringify(S),mod:S.mod||Date.now()});S.lastSync=Date.now();local();if(pg=='set')set()}catch(e){toast('Cloud save failed: '+e.message)}};now?go():pushT=setTimeout(go,2000)}
async function fbCfg(){try{const m=$('#fc').value.match(/\{[\s\S]*\}/),c=new Function('return '+m[0])();if(!c.apiKey||!c.projectId)throw 0;localStorage.setItem(FBK,JSON.stringify(c));await fbInit();toast('Config saved — now sign in');set()}catch(x){toast('Could not read config — paste the firebaseConfig block')}}
async function fbAuth(md){try{await fbInit();const e=$('#fe').value.trim(),p=$('#fp').value;if(md=='up')await FB.a.createUserWithEmailAndPassword(e,p);else if(md=='in')await FB.a.signInWithEmailAndPassword(e,p);else{await FB.a.sendPasswordResetEmail(e);toast('Password reset email sent')}}catch(x){toast(String(x.message).replace('Firebase: ',''))}}
function fbOut(){FB&&FB.a.signOut()}
function fbRemove(){if(!confirm('Remove cloud config from this device?'))return;fbOut();localStorage.removeItem(FBK);FB=null;U=null;set()}
function cloud(){const cfg=fbCfgGet(),b=(t)=>`<div class="card"><h3>☁ Cloud sync (your own Firebase project)</h3>${t}</div>`;
if(!cfg)return b(`<p class="m">Syncs your profile and applications across devices. Data goes only to your own Firebase project. Paste the <b>firebaseConfig</b> block from Firebase → Project settings → Your apps.</p><textarea id="fc" placeholder="const firebaseConfig = { apiKey: ..., projectId: ... };"></textarea><div class="btns"><button class="btn p" onclick="fbCfg()">Save config</button></div>`);
if(U)return b(`<p>Signed in as <b>${esc(U.email)}</b></p><p class="m">${S.lastSync?'Last cloud save: '+new Date(S.lastSync).toLocaleString():'Not saved yet'} · changes sync automatically.</p><div class="btns"><button class="btn p" onclick="cloudPush(1);toast('Saving…')">Sync now</button><button class="btn" onclick="fbOut()">Sign out</button></div>`);
return b(`<div class="f"><div><label>Email</label><input id="fe" type="email" autocomplete="username"></div><div><label>Password (6+ characters)</label><input id="fp" type="password" autocomplete="current-password"></div></div><div class="btns"><button class="btn p" onclick="fbAuth('in')">Sign in</button><button class="btn" onclick="fbAuth('up')">Create account</button><button class="btn" onclick="fbAuth('reset')">Forgot password</button>${FBCFG?'':'<button class="btn d" onclick="fbRemove()">Remove config</button>'}</div>`)}
if(fbCfgGet())fbInit().catch(e=>toast(e.message));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
</script></body></html>
