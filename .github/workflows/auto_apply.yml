name: JobPilot Cloud Auto-Apply Runner

on:
  workflow_dispatch:
    inputs:
      job_url:
        description: 'Job Application URL'
        required: true
        type: string
      company:
        description: 'Company Name'
        required: false
        default: 'Target Company'
        type: string
      role:
        description: 'Role Title'
        required: false
        default: 'Oracle DBA'
        type: string
      mode:
        description: 'Execution Mode (preview = fill and take screenshots only, submit = submit application)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - submit

jobs:
  apply:
    name: Execute Application Flow
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Execute Cloud Application
        run: |
          python scripts/cloud_apply.py \
            --url "${{ github.event.inputs.job_url }}" \
            --company "${{ github.event.inputs.company }}" \
            --role "${{ github.event.inputs.role }}" \
            --mode "${{ github.event.inputs.mode }}"

      - name: Upload Verification Screenshots & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-screenshots-${{ github.run_number }}
          path: artifacts/application_run/
          retention-days: 14
